  <style>
    :root {
      --orange: #F5A623;
      --orange-dark: #d4891a;
      --orange-glow: rgba(245, 166, 35, 0.08);
      --bg: #f2f2f2;
      --bg2: #e8e8e8;
      --bg3: #e0e0e0;
      --text: #111111;
      --text-muted: #777777;
      --card-bg: #ffffff;
      --card-border: #e8e8e8;
      --radius: 18px;
      --nav-height: 80px;
    }

    [data-theme="dark"] {
      --orange-glow: rgba(245, 166, 35, 0.15);
      --bg: #111111;
      --bg2: #1c1c1c;
      --bg3: #252525;
      --text: #ffffff;
      --text-muted: #888888;
      --card-bg: #1e1e1e;
      --card-border: #2d2d2d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      background-image: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.4s, color 0.4s;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(var(--nav-height) + 20px);
    }

    body.amharic,
    body.oromo {
      font-family: 'Noto Sans Ethiopic', 'Outfit', sans-serif;
    }

    .hero {
      position: relative;
      height: 360px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: url('hero.jpg') center/cover no-repeat;
      filter: brightness(0.85);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.85) 100%);
    }

    .hero-content {
      position: absolute;
      bottom: 32px;
      left: 24px;
      right: 24px;
    }

    .hero-title {
      font-size: clamp(32px, 8vw, 46px);
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hero-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2.5s infinite;
      box-shadow: 0 0 8px #4ade80;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: 0.6;
        transform: scale(1.4)
      }
    }

    .topbar {
      position: absolute;
      top: 16px;
      right: 16px;
      left: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      z-index: 10;
    }

    .lang-switcher {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 50px;
      padding: 4px;
      gap: 2px;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] .lang-switcher {
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .lang-btn {
      padding: 7px 16px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: transparent;
      color: #aaa;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: inherit;
    }

    .lang-btn.active {
      background: var(--orange);
      color: #fff;
      box-shadow: 0 2px 8px rgba(245, 166, 35, 0.3);
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: transform 0.3s, background 0.3s;
      color: var(--text);
    }

    [data-theme="dark"] .theme-btn {
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .theme-btn:hover {
      transform: rotate(20deg) scale(1.05);
    }

    .theme-btn i {
      display: flex;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 24px 16px 8px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      white-space: nowrap;
      padding: 10px 20px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: var(--bg3);
      color: var(--text-muted);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }

    .cat-btn.active {
      background: var(--orange);
      color: #fff;
      box-shadow: 0 4px 14px rgba(245, 166, 35, 0.25);
      transform: scale(1.02);
    }

    .cat-btn:hover:not(.active) {
      background: var(--bg2);

    .item-arrow {

    .bottom-nav {

    .nav-btn {

    .modal {

    .modal-row-icon {

    .item-modal .modal {

    .item-modal-img {

    .item-modal-body {

    .item-modal-title {
      font-size: 24px;

    .item-modal-desc {

    .section-heading {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);

      gap: 8px;

    }

    .section-heading::before {

      width: 4px;

    .toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--orange);
      color: #fff;

    @media (prefers-reduced-motion: reduce) {
      * {

<body data-theme="light">

  <div class="hero">

  <!-- PAYMENT MODAL -->

  <script>
    /* ── Translations ── */
    const T = {
      en: {
        heroTitle: RESTAURANT.name + " Digital Menu",
        heroBadge: RESTAURANT.name,
        payTitle: "Payment Information",
        paySub: "Accepted payment methods at the counter",
        payCash: "Cash",
        aboutTitle: "About " + RESTAURANT.name,
        aboutDesc: RESTAURANT.about,
        aboutLoc: RESTAURANT.location,
        // cat keys → display labels
        catLabels: {
          ALL: "All",
          FOOD: "Food",
          "HOT DRINKS": "Hot Drinks",
          DRINKS: "Drinks",
        },
        currency: "Birr"
      },
      am: {
        heroTitle: "ኤንድዋን ምናለ",
        heroBadge: "ኤንድዋን",
        payTitle: "የክፍያ መረጃ",
        paySub: "በካዉንተር ላይ ተቀባይነት ያላቸው የክፍያ ዘዴዎች",
        payCash: "ጥሬ ገንዘብ",
        aboutTitle: "ስለ ኤንድዋን",
        aboutDesc: RESTAURANT.about,
        aboutLoc: RESTAURANT.location,
        catLabels: {
          ALL: "ሁሉም",
          FOOD: "ምግቦች",
          "HOT DRINKS": "ሞቅ ያሉ መጠጦች",
          DRINKS: "መጠጦች",
        },
        currency: "ብር"
      },
      om: {
        heroTitle: "Caaru " + RESTAURANT.name,
        heroBadge: RESTAURANT.name,
        payTitle: "Odeeffannoo Kaffaltii",
        paySub: "Maloota kaffaltii fudhataman",
        payCash: "Maallaqa",
        aboutTitle: "Waa'ee " + RESTAURANT.name,
        aboutDesc: RESTAURANT.about,
        aboutLoc: RESTAURANT.location,
        catLabels: {
          ALL: "Hunda",
          FOOD: "Nyaata",
          "HOT DRINKS": "Dhugaatii Ho'aa",
          DRINKS: "Dhugaatii",
        },
        currency: "ETB"
      }
    };

    let lang = 'en', theme = 'light', activecat = 'ALL';

    /* ── Build payment modal dynamically ── */
    function buildPaymentModal() {
      const container = document.getElementById('bankAccountsContainer');
      container.innerHTML = '';

      BANKS.forEach(bank => {
        if (!bank.show) return;
        const row = document.createElement('div');
        row.className = 'modal-row clickable';
        row.setAttribute('onclick', `copyToClipboard('${bank.number}','${bank.name} Account')`);
        row.innerHTML = `
          <div style="display:flex;align-items:center;gap:14px;">
            <span class="modal-row-icon"><i class="ph ${bank.icon}"></i></span>
            <div class="modal-row-text">
              <span class="modal-row-label">${bank.name}</span>
              <span class="modal-row-meta">${bank.display}</span>
            </div>
          </div>
          <span class="modal-row-action"><i class="ph ph-copy"></i></span>
        `;
        container.appendChild(row);
      });

      document.getElementById('telebirrDisplay').textContent = MOBILE_PAY.telebirr_display;
      document.getElementById('rowTelebirr').style.display = MOBILE_PAY.show_telebirr ? 'flex' : 'none';
      if (CASH_PAY.show) document.getElementById('rowCash').style.display = 'flex';
    }

    function setLang(l) {
      lang = l;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('active');
      document.body.classList.remove('amharic', 'oromo');
      if (l === 'am') document.body.classList.add('amharic');
      else if (l === 'om') document.body.classList.add('oromo');
      updateTranslations();
      renderCategories();
      renderMenu();
    }

    function updateTranslations() {
      const t = T[lang];
      document.getElementById('heroTitle').textContent = t.heroTitle;
      document.getElementById('heroBadge').textContent = t.heroBadge;
      document.getElementById('payTitle').textContent = t.payTitle;
      document.getElementById('paySub').textContent = t.paySub;
      document.getElementById('payCash').textContent = t.payCash;
      document.getElementById('aboutTitle').textContent = t.aboutTitle;
      document.getElementById('aboutDesc').textContent = t.aboutDesc;
      document.getElementById('aboutLoc').textContent = t.aboutLoc;
      document.getElementById('aboutPhone').textContent = RESTAURANT.phone;
    }

    function toggleTheme() {
      theme = theme === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', theme);
      document.getElementById('themeIcon').className = theme === 'light' ? 'ph ph-sun' : 'ph ph-moon';
    }

    /* ── Derive unique ordered category list from MENU ── */
    function getCategories() {
      const seen = new Set();
      MENU.forEach(m => seen.add(m.cat));
      return Array.from(seen);
    }

    function renderCategories() {
      const labels = T[lang].catLabels;
      const cats = getCategories();
      const el = document.getElementById('categories');
      el.innerHTML = `<button class="cat-btn${activecat === 'ALL' ? ' active' : ''}" onclick="filterCat('ALL')">${labels['ALL']}</button>`;
      cats.forEach(cat => {
        const label = labels[cat] || cat;
        el.innerHTML += `<button class="cat-btn${activecat === cat ? ' active' : ''}" onclick="filterCat('${cat}')">${label}</button>`;
      });
    }

    function filterCat(key) {
      activecat = key;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const t = T[lang];
      const labels = t.catLabels;
      const list = document.getElementById('menuList');
      const filtered = activecat === 'ALL' ? MENU : MENU.filter(m => m.cat === activecat);
      list.innerHTML = '';
      let lastCat = null;

      filtered.forEach((item, i) => {
        // Section heading in ALL view
        if (activecat === 'ALL' && item.cat !== lastCat) {
          lastCat = item.cat;
          const h = document.createElement('div');
          h.className = 'section-heading';
          h.textContent = labels[item.cat] || item.cat;
          list.appendChild(h);
        }

        const el = document.createElement('div');
        el.className = 'menu-item';
        el.style.animationDelay = `${i * 0.04}s`;

        const isSpecial = item.id === 1;
        const badgeHtml = isSpecial
          ? `<span class="item-badge special">SPECIAL</span>`
          : `<span class="item-price-badge">${item.price}</span>`;

        el.innerHTML = `
          <div class="item-img-wrap">
            <img class="item-img" src="${item.img}" alt="${item.name[lang]}" loading="lazy" onerror="this.src='${PLACEHOLDER_IMAGE}'">
            ${badgeHtml}
          </div>
          <div class="item-info">
            <div class="item-name">${item.emoji} ${item.name[lang]}</div>
            <div class="item-desc">${item.desc[lang]}</div>
            <div class="item-footer">
              <div class="item-price"><span class="etb-label">ETB</span><span class="price-num">${item.price}</span></div>
              <span class="item-arrow"><i class="ph ph-arrow-right"></i></span>
            </div>
          </div>
        `;
        el.onclick = () => openItem(item);
        list.appendChild(el);
      });
    }

    function openItem(item) {
      const t = T[lang];
      document.getElementById('itemModalImg').src = item.img;
      document.getElementById('itemModalImg').onerror = function () { this.src = PLACEHOLDER_IMAGE; };
      document.getElementById('itemModalImg').alt = item.name[lang];
      document.getElementById('itemModalName').textContent = item.emoji + ' ' + item.name[lang];
      document.getElementById('itemModalDesc').textContent = item.desc[lang];
      document.getElementById('itemModalPrice').textContent = `${item.price} ${t.currency}`;
      document.getElementById('itemModal').classList.add('open');
    }

    function showModal(type) {
      document.getElementById(type + 'Modal').classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
      setTimeout(() => {
        if (!document.querySelector('.modal-backdrop.open')) activateNav('home');
      }, 100);
    }

    function activateNav(navId) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const key = navId.charAt(0).toUpperCase() + navId.slice(1);
      const btn = document.getElementById('nav' + key);
      if (btn) btn.classList.add('active');
      if (navId === 'home') window.scrollTo({ top: 0, behavior: 'smooth' });
      else if (navId === 'payment') showModal('payment');
      else if (navId === 'about') showModal('about');
    }

    async function copyToClipboard(text, label) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      showToast(label + ' copied!');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    window.addEventListener('scroll', () => {
      const bg = document.getElementById('heroBg');
      if (bg && window.scrollY < 500) bg.style.transform = `translateY(${window.scrollY * 0.4}px)`;
    }, { passive: true });

    document.querySelectorAll('.modal-backdrop').forEach(b => {
      b.addEventListener('click', e => {
        if (e.target === b) {
          b.classList.remove('open');
          setTimeout(() => {
            if (!document.querySelector('.modal-backdrop.open')) activateNav('home');
          }, 100);
        }
      });
    });

    // Boot
    buildPaymentModal();
    updateTranslations();
    renderCategories();
    renderMenu();
  </script>
</body>

</html>
